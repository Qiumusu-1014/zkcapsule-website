<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="联系中科国际，提交ZK系列模块化智能太空舱项目需求。">
  <title>联系我们 - 中科国际 - 智慧太空舱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260528-2">
</head>
<body class="ui-hybrid page-contact">
  <div data-site-header></div>
  <main>
    <section class="page-hero contact-hero">
      <div class="container contact-hero-layout">
        <div>
          <span class="section-tag">PROJECT INQUIRY</span>
          <h1 data-i18n="contact.title">联系我们</h1>
          <p data-i18n="contact.subtitle">提交您的项目方向与意向型号，我们将据此推进产品选型与方案沟通。</p>
        </div>
        <img class="contact-hero-product" src="assets/media/brand/hero-top.webp" alt="中科智慧太空舱展示场景">
      </div>
    </section>

    <section class="section light-section contact-section">
      <div class="container contact-layout">
        <aside class="contact-info-cards reveal">
          <article class="direct-contact-card">
            <span class="section-tag" data-i18n="contact.directTag">项目咨询</span>
            <h2 data-i18n="contact.contactPersonValue">杨涛峰</h2>
            <a class="direct-phone" href="tel:13319274381" data-i18n="contact.phoneValue">13319274381</a>
            <p data-i18n="contact.directNote">产品选型、项目合作与定制需求可直接电话联系。</p>
          </article>
          <article class="contact-card">
            <h3 data-i18n="contact.companyLabel">公司名称</h3>
            <p data-i18n="contact.companyValue">中科国际</p>
          </article>
          <article class="contact-card">
            <h3 data-i18n="contact.addressLabel">地址</h3>
            <p data-i18n="contact.addressValue">香港尖沙咀麼地道75号南洋中心2座7楼</p>
          </article>
          <article class="contact-card">
            <h3 data-i18n="contact.registrationLabel">注册证号</h3>
            <p data-i18n="contact.registrationNo">78386327</p>
          </article>
        </aside>

        <section class="contact-form-area reveal">
          <h2 data-i18n="contact.formTitle">提交项目需求</h2>
          <form id="inquiryForm" action="https://formsubmit.co/ajax/info@zhongkeintl.com" method="POST">
            <input type="hidden" name="_subject" value="中科国际官网项目需求">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="form-honey" aria-hidden="true">
            <div class="form-grid">
              <div class="form-group">
                <label for="name" data-i18n="contact.formName">姓名</label>
                <input id="name" name="姓名" required data-i18n-placeholder="contact.formNamePlaceholder" placeholder="请输入您的姓名">
              </div>
              <div class="form-group">
                <label for="phone" data-i18n="contact.formPhone">联系电话</label>
                <input id="phone" name="联系电话" type="tel" required data-i18n-placeholder="contact.formPhonePlaceholder" placeholder="请输入联系电话">
              </div>
              <div class="form-group">
                <label for="company" data-i18n="contact.formCompany">公司</label>
                <input id="company" name="公司" data-i18n-placeholder="contact.formCompanyPlaceholder" placeholder="请输入您的公司名称">
              </div>
              <div class="form-group">
                <label for="region" data-i18n="contact.formRegion">项目地区</label>
                <input id="region" name="项目地区" data-i18n-placeholder="contact.formRegionPlaceholder" placeholder="请输入项目所在地区">
              </div>
              <div class="form-group">
                <label for="productSelect" data-i18n="contact.formInterest">意向型号</label>
                <select id="productSelect" name="意向型号"></select>
              </div>
              <div class="form-group">
                <label for="scenarioSelect" data-i18n="contact.formScenario">应用场景</label>
                <select id="scenarioSelect" name="应用场景"></select>
              </div>
              <div class="form-group full">
                <label for="message" data-i18n="contact.formMessage">项目说明</label>
                <textarea id="message" name="项目说明" data-i18n-placeholder="contact.formMessagePlaceholder" placeholder="请描述使用场景、功能需求或预计部署规模..."></textarea>
              </div>
            </div>
            <button class="btn btn-primary" type="submit" data-i18n="contact.formSubmit">提交咨询</button>
            <p class="form-note" data-i18n="contact.formNote">具体配置、运输安装、审批及商务条款将在项目沟通阶段确认。</p>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="assets/js/i18n.js?v=20260528-2"></script>
  <script src="assets/js/product-data.js?v=20260528-2"></script>
  <script src="assets/js/site-components.js?v=20260528-2"></script>
  <script src="assets/js/main.js?v=20260528-2"></script>
  <script>
    (function () {
      'use strict';
      var query = new URLSearchParams(window.location.search);
      var initialModel = query.get('model') || '';
      var initialScenario = query.get('scenario') || '';
      var scenarios = [
        { value: 'stay', key: 'contact.scenarioStay' },
        { value: 'education', key: 'contact.scenarioEducation' },
        { value: 'medical', key: 'contact.scenarioMedical' },
        { value: 'commercial', key: 'contact.scenarioCommercial' },
        { value: 'emergency', key: 'contact.scenarioEmergency' },
        { value: 'flagship', key: 'contact.scenarioFlagship' }
      ];

      function renderSelects() {
        var catalog = window.ZK_PRODUCT_MODELS;
        var product = document.getElementById('productSelect');
        var scenario = document.getElementById('scenarioSelect');
        var productValue = product.value || initialModel;
        var scenarioValue = scenario.value || initialScenario;
        product.innerHTML = '<option value="">' + ZK.t('contact.selectProduct') + '</option>' + catalog.order.map(function (id) {
          var item = catalog.items[id];
          return '<option value="' + id + '">' + item.code + ' ' + ZK.t(item.nameKey) + '</option>';
        }).join('');
        scenario.innerHTML = '<option value="">' + ZK.t('contact.selectScenario') + '</option>' + scenarios.map(function (item) {
          return '<option value="' + item.value + '">' + ZK.t(item.key) + '</option>';
        }).join('');
        if (catalog.items[productValue]) product.value = productValue;
        if (scenarios.some(function (item) { return item.value === scenarioValue; })) scenario.value = scenarioValue;
        initialModel = '';
        initialScenario = '';
      }

      document.addEventListener('DOMContentLoaded', function () {
        renderSelects();
        document.getElementById('inquiryForm').addEventListener('submit', function (event) {
          event.preventDefault();
          var form = event.currentTarget;
          var endpoint = form.getAttribute('action');
          var status = document.getElementById('formStatus');
          var button = form.querySelector('button[type="submit"]');
          var product = document.getElementById('productSelect');
          var scenario = document.getElementById('scenarioSelect');
          if (!endpoint || endpoint.indexOf('formsubmit.co/ajax/') === -1) {
            status.textContent = ZK.t('contact.formConfigMissing');
            status.className = 'form-status is-error';
            return;
          }
          var data = new FormData(form);
          data.set('意向型号', product.options[product.selectedIndex] ? product.options[product.selectedIndex].text : '');
          data.set('应用场景', scenario.options[scenario.selectedIndex] ? scenario.options[scenario.selectedIndex].text : '');
          data.set('提交页面', window.location.href);
          data.set('提交时间', new Date().toLocaleString('zh-CN', { hour12: false }));
          status.textContent = ZK.t('contact.formSending');
          status.className = 'form-status';
          button.disabled = true;
          fetch(endpoint, {
            method: 'POST',
            headers: { Accept: 'application/json' },
            body: data
          }).then(function (response) {
            if (!response.ok) throw new Error('Form submit failed');
            form.reset();
            renderSelects();
            status.textContent = ZK.t('contact.thanks');
            status.className = 'form-status is-success';
          }).catch(function () {
            status.textContent = ZK.t('contact.formSendError');
            status.className = 'form-status is-error';
          }).finally(function () {
            button.disabled = false;
          });
        });
      });
      document.addEventListener('zk:langchange', renderSelects);
    })();
  </script>
</body>
</html>
