<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中科ZK系列太空舱产品详情，查看建议面积、内部功能和适用场景。">
  <title>产品详情 - 中科国际顾问 - 智慧太空舱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-site-header></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="section-tag" data-i18n="detail.label">产品详情</span>
        <h1 id="detailPageTitle">ZK01 基础生活舱</h1>
        <p id="detailPageTagline">轻装启程，舒适即刻落地。</p>
      </div>
    </section>

    <section class="section model-detail-nav-section">
      <div class="container detail-model-nav">
        <span data-i18n="detail.selectModel">选择型号</span>
        <div id="detailModelNav"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="detail-hero-card reveal">
          <div class="detail-hero-media" id="detailHeroMedia"></div>
          <div class="detail-hero-copy">
            <span class="section-tag" id="detailModelCode">ZK01</span>
            <h2 id="detailModelName">基础生活舱</h2>
            <p id="detailSummary"></p>
            <div class="detail-feature-pills">
              <span id="detailArea"></span>
              <span id="detailUse"></span>
            </div>
            <div class="detail-actions">
              <a class="btn btn-primary" id="detailConsultLink" href="contact.html?model=zk01" data-i18n="detail.consult">咨询该型号</a>
              <a class="btn btn-outline" href="products.html" data-i18n="detail.backToProducts">返回产品中心</a>
              <a class="btn btn-outline" id="detailZK06Link" href="zk06.html" data-i18n="detail.featureZK06" hidden>查看 ZK06 专题</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-surface">
      <div class="container">
        <div class="detail-spec-grid reveal">
          <article class="info-tile"><h3 data-i18n="detail.area">建议面积</h3><p id="specArea"></p></article>
          <article class="info-tile"><h3 data-i18n="detail.use">重点应用</h3><p id="specUse"></p></article>
          <article class="info-tile"><h3 data-i18n="detail.exterior">外观定位</h3><p id="specExterior"></p></article>
          <article class="info-tile"><h3 data-i18n="detail.interior">内部功能</h3><p id="specInterior"></p></article>
          <article class="info-tile"><h3 data-i18n="detail.configuration">配置重点</h3><p id="specConfiguration"></p></article>
        </div>
        <div class="note-panel reveal">
          <h3 data-i18n="detail.noteTitle">项目确认说明</h3>
          <p data-i18n="detail.note">所列面积与功能配置为产品建议方案。具体尺寸、设备品牌、运输安装、医疗合规及审批要求，以项目深化方案和双方确认清单为准。</p>
        </div>
      </div>
    </section>

    <section class="section" id="officialMediaSection">
      <div class="container">
        <div class="section-header reveal">
          <h2 class="section-title" data-i18n="detail.imagery">正式影像</h2>
          <p class="section-subtitle" data-i18n="detail.imageryDesc">仅展示已确认的产品影像；尚未提供正式素材的型号以文字参数为准。</p>
        </div>
        <div class="detail-gallery-grid reveal" id="detailGalleryGrid"></div>
        <p class="detail-empty-note" id="detailNoImages" data-i18n="detail.noImages" hidden>该型号的正式影像将在资料确认后发布。</p>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/product-data.js"></script>
  <script src="assets/js/site-components.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      'use strict';
      var catalog = window.ZK_PRODUCT_MODELS;
      var queryId = new URLSearchParams(window.location.search).get('model');
      var modelId = catalog.items[queryId] ? queryId : 'zk01';

      function renderDetail() {
        var model = catalog.items[modelId];
        document.getElementById('detailPageTitle').textContent = model.code + ' ' + ZK.t(model.nameKey);
        document.getElementById('detailPageTagline').textContent = ZK.t(model.taglineKey);
        document.getElementById('detailModelCode').textContent = model.code;
        document.getElementById('detailModelName').textContent = ZK.t(model.nameKey);
        document.getElementById('detailSummary').textContent = ZK.t(model.summaryKey);
        document.getElementById('detailArea').textContent = ZK.t(model.areaKey);
        document.getElementById('detailUse').textContent = ZK.t(model.useKey);
        document.getElementById('specArea').textContent = ZK.t(model.areaKey);
        document.getElementById('specUse').textContent = ZK.t(model.useKey);
        document.getElementById('specExterior').textContent = ZK.t(model.exteriorKey);
        document.getElementById('specInterior').textContent = ZK.t(model.interiorKey);
        document.getElementById('specConfiguration').textContent = ZK.t(model.configKey);
        document.getElementById('detailConsultLink').href = 'contact.html?model=' + modelId;
        document.getElementById('detailZK06Link').hidden = modelId !== 'zk06';

        var media = document.getElementById('detailHeroMedia');
        media.classList.toggle('no-image', !model.image);
        media.innerHTML = model.image
          ? '<img src="' + model.image + '" alt="' + model.code + ' ' + ZK.t(model.nameKey) + '">'
          : '<div class="product-text-visual"><strong>' + model.code + '</strong><span>' + ZK.t('products.noImage') + '</span></div>';

        document.getElementById('detailModelNav').innerHTML = catalog.order.map(function (id) {
          var current = id === modelId ? ' active' : '';
          return '<a class="detail-model-chip' + current + '" href="product-detail.html?model=' + id + '">' + catalog.items[id].code + '</a>';
        }).join('');

        var grid = document.getElementById('detailGalleryGrid');
        var empty = document.getElementById('detailNoImages');
        if (model.gallery.length) {
          empty.hidden = true;
          grid.innerHTML = model.gallery.map(function (image) {
            var caption = ZK.t(image.captionKey);
            return '<button class="detail-gallery-item" type="button" data-lightbox="' + image.src + '" data-caption="' + caption + '">' +
              '<img src="' + image.src + '" alt="' + caption + '"><span class="detail-gallery-caption">' + caption + '</span></button>';
          }).join('');
        } else {
          grid.innerHTML = '';
          empty.hidden = false;
        }
      }

      document.addEventListener('DOMContentLoaded', renderDetail);
      document.addEventListener('zk:langchange', renderDetail);
    })();
  </script>
</body>
</html>
